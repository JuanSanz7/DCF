services:
  app:
    build: .
    ports: ["8000:8000"]
    volumes: ["./data:/data"]           # the SQLite register lives here
    environment:
      # DCF_APP_PASSWORD: "choose-one"   # uncomment to require a password
      # DCF_SECRET: "long-random-string" # keeps sessions valid across restarts
      DCF_DATA_DIR: /data
    restart: unless-stopped
