services:
  app:
    build: .
    ports: ["8000:7860"]
    volumes: ["./data:/data"]             # the SQLite register lives here
    environment:
      DCF_DATA_DIR: /data
      # DCF_DATABASE_URL: "postgresql://..."   # use a hosted Postgres instead of the local file
      # DCF_INVITE_CODE: "choose-one"          # only people with this code can create accounts
    restart: unless-stopped
