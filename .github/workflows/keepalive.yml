name: Keep the app awake
# Free Render services sleep after 15 minutes idle and take ~1 minute to wake up.
# Pinging every 10 minutes during the day keeps it responsive (within Render's 750 free hours/month).
on:
  schedule:
    - cron: "*/10 6-22 * * *"   # 07:00-23:59 Berlin (UTC+1)
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 https://value-field.onrender.com/api/health || true
