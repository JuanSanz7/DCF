[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dcfmc"
version = "2.0.0"
description = "Intrinsic valuation: FCFF DCF with Monte Carlo simulation and a valuation register"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "pydantic>=2.11",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "openpyxl>=3.1",
  "yfinance>=0.2.54",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
dcfmc = "dcfmc.__main__:main"

[tool.setuptools.packages.find]
include = ["dcfmc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
